name: fortuneboot
description: "Hao Ji"
version: 1.3.14+2026040809 #😁😈
publish_to: 'none'

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  bloc: ^9.0.0
  cupertino_icons: ^1.0.3
  encrypt: ^5.0.3
  flutter:
    sdk: flutter
  flutter_intl: ^0.0.1
  flutter_localizations:
    sdk: flutter
  flutter_login: ^5.0.0
  font_awesome_flutter: ^10.9.1
  json_annotation: ^4.9.0
  logger: ^2.5.0
  retrofit: 4.7.2
  shared_preferences: ^2.5.3
  # 鸿蒙平台 SharedPreferences 支持
  shared_preferences_ohos:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/shared_preferences/shared_preferences_ohos
      ref: master
  flutter_bloc: ^9.1.0
  sticky_grouped_list: ^3.1.0
  bloc_concurrency: ^0.3.0
  # dropdown_flutter: ^1.0.1
  multi_dropdown: ^3.0.1
  accordion: ^2.6.0
  # awesome_select_plus: ^1.0.0
  omni_datetime_picker: ^2.3.1

  package_info_plus: ^9.0.0
  # 附件上传相关依赖
  file_picker: ^10.3.3
  image_picker: ^1.1.2
  path: ^1.9.0
  mime: ^2.0.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  image_gallery_saver_plus: ^4.0.1
  visibility_detector: ^0.4.0+2
  rxdart: ^0.28.0
  time: ^2.1.5
  flutter_randomcolor: ^1.0.18
  intl: ^0.20.2
  money2: ^6.0.8
  equatable: ^2.0.5
  fl_chart: ^0.68.0
  xml: ^6.3.0

dev_dependencies:
  build_runner: ^2.4.0
  change_app_package_name: ^1.5.0
  # flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.5
  lint: ^2.1.2
  retrofit_generator: ^10.0.6
  flutter_launcher_icons: ^0.14.4

# flutter pub run flutter_launcher_icons
flutter_icons:
  image_path: "assets/images/LOGO.png"  # 源图标路径（建议 1024x1024）
  remove_alpha_ios: true
  android: true
  ios: true
  # 鸿蒙平台需要手动配置图标
  # 图标位置: ohos/AppScope/resources/base/media/app_icon.png
  # 图标位置: ohos/entry/src/main/resources/base/media/icon.png

flutter_intl:
    enabled: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/OpenSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    - family: SourceSansPro
      fonts:
        - asset: assets/fonts/SourceSansPro-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/SourceSansPro-ExtraLightItalic.ttf
          weight: 200
        - asset: assets/fonts/SourceSansPro-Light.ttf
          weight: 300
        - asset: assets/fonts/SourceSansPro-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/SourceSansPro-Regular.ttf
        - asset: assets/fonts/SourceSansPro-Italic.ttf
          style: italic
        - asset: assets/fonts/SourceSansPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSansPro-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/SourceSansPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSansPro-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Italic.ttf
          style: italic
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Light.ttf
          weight: 300
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
